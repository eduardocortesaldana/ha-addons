name: Estados de cuenta
version: "1.0.3"
slug: estados_cuenta
description: Guarda en Nextcloud los estados de cuenta que llegan por correo y avisa por Telegram a través de Home Assistant
url: https://github.com/eduardocortesaldana/ha-addons/tree/main/estados_cuenta
arch:
  - amd64
startup: services
boot: auto
homeassistant_api: true
hassio_api: true
hassio_role: default
map:
  - type: addon_config
    read_only: false
options:
  modo: simular
  imap_servidor: imap.ejemplo.com
  imap_puerto: 993
  imap_usuario: ""
  imap_clave: ""
  imap_carpeta: INBOX
  nc_url: https://homeassistant.local:8099
  nc_usuario: ""
  nc_clave: ""
  nc_huella_sha256: ""
  nc_carpeta: Estados de cuenta/BBVA
  bbva_nombre: BBVA
  bbva_archivo: "{anio}-{mes} BBVA.pdf"
  bbva_pdf_clave: ""
  bbva_remitente: bbva.mx
  avisos_servicio: telegram_bot.send_message
  avisos_entidad: ""
  avisos_tema: 0
  recordatorio_desde_dia: 5
  recordatorio_cada_dias: 2
  revisar_cada_min: 10
  zona_horaria: America/Mexico_City
  empezar_de_cero: false
  releer_todo: false
schema:
  modo: list(normal|simular|probar-correo|probar-avisos|huella)
  imap_servidor: str
  imap_puerto: port
  imap_usuario: str
  imap_clave: password
  imap_carpeta: str
  nc_url: url
  nc_usuario: str
  nc_clave: password
  nc_huella_sha256: str?
  nc_carpeta: str
  bbva_nombre: str
  bbva_archivo: str
  bbva_pdf_clave: password?
  bbva_remitente: str
  avisos_servicio: str
  avisos_entidad: str?
  avisos_tema: int(0,100000)?
  recordatorio_desde_dia: int(1,28)
  recordatorio_cada_dias: int(1,15)
  revisar_cada_min: int(2,120)
  zona_horaria: str
  empezar_de_cero: bool
  releer_todo: bool
